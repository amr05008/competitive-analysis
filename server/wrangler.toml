# Top level is the dev environment; tests use it too.
name = "competitive-analysis-dev"
main = "src/index.ts"
# The newest date the test pool's bundled workerd (1.20260815.1) supports, so
# tests and production run the same runtime flags. Raise it with the pool.
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]

workers_dev = false
preview_urls = false

# Never log tool inputs.
[observability]
enabled = false

[vars]
ENVIRONMENT = "dev"
DAILY_TOOL_CALL_CAP = "200"
# Fetches plus Cache API calls per tool call. The free plan allows 50 per
# request; raise this to about 900 on the paid plan.
SUBREQUEST_LIMIT = "45"

# One global instance (idFromName("global")): the archive gate, the daily call
# cap and anonymous usage counts.
[[durable_objects.bindings]]
name = "LIMITS"
class_name = "Limits"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limits"]

# Environments inherit observability (off), workers_dev, preview_urls and the
# migrations above. Vars and Durable Object bindings don't inherit, so each
# environment repeats them.

# A custom domain, not workers.dev, because the Cache API does nothing on
# workers.dev. No crons: the self-check belongs to production.
[env.staging]
name = "competitive-analysis-staging"
routes = [{ pattern = "competitive-analysis-staging.aaronmichaelroy.com", custom_domain = true }]

[env.staging.vars]
ENVIRONMENT = "staging"
DAILY_TOOL_CALL_CAP = "200"
# About 900 on the paid plan.
SUBREQUEST_LIMIT = "45"
# The archive refuses Cloudflare's network; see ../relay. ARCHIVE_RELAY_TOKEN
# is a secret.
ARCHIVE_RELAY_URL = "https://competitive-analysis-relay.vercel.app/api/archive"

[[env.staging.durable_objects.bindings]]
name = "LIMITS"
class_name = "Limits"
